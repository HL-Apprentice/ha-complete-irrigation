run_zone:
  name: Run zone
  description: >
    Run an irrigation zone manually for the specified number of minutes.
    Turns the zone's underlying switch on, then off after the duration
    elapses. If the switch is turned off externally before the
    duration, the auto-stop is cancelled.
  fields:
    entity_id:
      name: Zone switch
      description: The zone switch entity to run.
      required: true
      selector:
        entity:
          domain: switch
    minutes:
      name: Duration (minutes)
      description: How long to run the zone. Default 10 min. Hard cap 60 min.
      required: false
      default: 10
      example: 15
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
          unit_of_measurement: min

stop_zone:
  name: Stop zone
  description: >
    Stop a currently-running zone. If the zone was started via run_zone,
    cancels the pending auto-stop. Otherwise just turns the switch off.
  fields:
    entity_id:
      name: Zone switch
      description: The zone switch entity to stop.
      required: true
      selector:
        entity:
          domain: switch

add_schedule:
  name: Add schedule
  description: >
    Create a new recurring irrigation schedule. Persists across HA restarts.
  fields:
    name:
      name: Schedule name
      description: A human-friendly label for this schedule.
      required: true
      example: "Morning Front Lawn"
      selector:
        text:
    zone_entity_id:
      name: Zone
      description: The zone switch this schedule will run.
      required: true
      selector:
        entity:
          domain: switch
    start_time:
      name: Start time
      description: Time of day to start the run (24-hour, local time).
      required: true
      example: "06:00"
      selector:
        time:
    duration_minutes:
      name: Duration (minutes)
      description: How long the run lasts. Hard cap 480 min (8 hours).
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min
    weekdays:
      name: Weekdays (weekdays mode only)
      description: "Days of the week to run (0=Mon..6=Sun, ISO). Required when mode is 'weekdays'."
      required: false
      example: "[0, 1, 2, 3, 4]"
      selector:
        object:
    enabled:
      name: Enabled
      description: Whether the schedule fires (default true).
      required: false
      default: true
      selector:
        boolean:
    mode:
      name: Recurrence mode
      description: "weekdays = fires on listed days each week; interval = fires every N days from a start date."
      required: false
      default: weekdays
      selector:
        select:
          options: ["weekdays", "interval"]
    interval_days:
      name: Interval (days)
      description: "For interval mode: fire every N days. e.g. 5 = every 5 days."
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
    interval_anchor:
      name: First run date
      description: "For interval mode: the date of the first run. Subsequent runs step by interval_days."
      required: false
      selector:
        date:
    zone_steps:
      name: Additional zones (multi-zone mode)
      description: >
        Optional list of {zone_entity_id, duration_minutes} dicts. If
        provided, the schedule fires zones in order, back-to-back at
        run time (each waits for the previous to finish + 30s valve
        buffer). The first entry must match `zone_entity_id` +
        `duration_minutes`. Per-zone moisture gating still applies, so
        any sensor-saturated zone in the sequence is skipped.
      required: false
      example: "[{zone_entity_id: switch.front_lawn, duration_minutes: 15}, {zone_entity_id: switch.back_lawn, duration_minutes: 10}]"
      selector:
        object:

update_schedule:
  name: Update schedule
  description: Edit fields of an existing schedule. Pass schedule_id + any fields to change.
  fields:
    schedule_id:
      name: Schedule ID
      description: The id of the schedule to update.
      required: true
      selector:
        text:
    name:
      required: false
      selector:
        text:
    zone_entity_id:
      required: false
      selector:
        entity:
          domain: switch
    start_time:
      required: false
      selector:
        time:
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min
    weekdays:
      required: false
      selector:
        object:
    enabled:
      required: false
      selector:
        boolean:
    mode:
      required: false
      selector:
        select:
          options: ["weekdays", "interval"]
    interval_days:
      required: false
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
    interval_anchor:
      required: false
      selector:
        date:
    zone_steps:
      required: false
      selector:
        object:

delete_schedule:
  name: Delete schedule
  description: Permanently remove a schedule by id.
  fields:
    schedule_id:
      name: Schedule ID
      description: The id of the schedule to delete.
      required: true
      selector:
        text:

set_schedule_enabled:
  name: Set schedule enabled
  description: Toggle a schedule on or off without deleting it.
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

set_weather_config:
  name: Set weather config
  description: >
    Configure rain lockout + hot weather boost. All fields optional —
    only the ones you pass are updated.
  fields:
    rain_sensor:
      name: Rain sensor (legacy)
      description: Single rainfall sensor (in inches). Prefer `rain_sensors` for multi-sensor setups.
      required: false
      selector:
        entity:
          domain: sensor
    rain_sensors:
      name: Rain sensors
      description: One or more rainfall sensors (accumulation today/yesterday, duration, intensity, etc.). The first one is used for lockout; all show on the Today banner.
      required: false
      example: "['sensor.gilbert_rain_accumulation_today', 'sensor.gilbert_rain_intensity']"
      selector:
        object:
    temperature_sensor:
      name: Temperature sensor
      description: Sensor reporting current outdoor temperature in °F (for hot weather boost).
      required: false
      selector:
        entity:
          domain: sensor
    hot_threshold_f:
      name: Hot weather threshold (°F)
      description: Boost runtime when temperature meets or exceeds this value.
      required: false
      default: 100
      selector:
        number:
          min: 50
          max: 130
          step: 1
          mode: box
    boost_percent:
      name: Hot weather boost (%)
      description: Increase runtime by this percent on hot days.
      required: false
      default: 25
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    wind_sensor:
      name: Wind sensor (optional)
      description: Sensor reporting current wind speed (mph). If omitted, falls back to any `weather.*` entity's `wind_speed` attribute.
      required: false
      selector:
        entity:
          domain: sensor
    wind_defer_mph:
      name: Wind defer threshold (mph)
      description: Skip scheduled runs when current wind ≥ this many mph. 0 disables wind defer entirely.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 80
          step: 1
          mode: box

set_zone_moisture:
  name: Set zone moisture config
  description: >
    Bind moisture sensor(s) to a zone with min / target / max thresholds
    and a combine mode. Required for sensor-driven runtime adjustment.
  fields:
    zone_entity_id:
      name: Zone switch
      required: true
      selector:
        entity:
          domain: switch
    moisture_entities:
      name: Moisture sensors
      description: One or more moisture % sensors for this zone.
      required: true
      selector:
        object:
    combine_mode:
      name: Combine mode (multiple sensors)
      description: How to combine multiple sensor readings.
      required: false
      default: average
      selector:
        select:
          options: ["average", "lowest", "highest", "primary"]
    min_pct:
      name: Minimum moisture (%)
      description: Below this — urgent boost. Default 21% (lawn).
      required: false
      default: 21
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    target_pct:
      name: Target moisture (%)
      description: Default 31% (lawn).
      required: false
      default: 31
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    max_pct:
      name: Maximum moisture (%)
      description: Above this — skip the run (saturated). Default 40% (lawn).
      required: false
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    category:
      name: Plant category
      description: "Optional label for grouping (lawn, vegetable_garden, bushes, citrus, trees, custom)."
      required: false
      selector:
        text:
    temperature_entities:
      name: Temperature sensors (optional)
      description: One or more temperature sensors for this zone (display-only; averaged when multiple).
      required: false
      example: "['sensor.front_yard_temperature']"
      selector:
        object:
    humidity_entities:
      name: Humidity sensors (optional)
      description: One or more humidity sensors for this zone (display-only; averaged when multiple).
      required: false
      example: "['sensor.front_yard_humidity']"
      selector:
        object:

clear_rain_lockout:
  name: Clear rain lockout
  description: Manually end the current rain lockout (schedules resume immediately).

set_conflict_policy:
  name: Set schedule-conflict policy
  description: >
    When two schedules' run windows overlap, this picks how the coordinator
    resolves them. Default is `defer_new` (skip the new one).
  fields:
    policy:
      name: Policy
      description: >
        defer_new = new run skipped; shift_existing = move existing earlier
        to make room; split_difference = move both equally apart.
      required: true
      selector:
        select:
          options:
            - "defer_new"
            - "shift_existing"
            - "split_difference"

set_notification_config:
  name: Set notification config
  description: Configure where to push notifications + quiet hours window.
  fields:
    notify_target:
      name: Notify target service (single, legacy)
      description: "Format: notify.<service> (e.g., notify.mobile_app_pete_iphone). Prefer `notify_targets` to send to multiple devices."
      required: false
      selector:
        text:
    notify_targets:
      name: Notify target services (multi)
      description: "List of notify.<service> entries (or a comma-separated string). Each notification fans out to every entry."
      required: false
      example: "['notify.mobile_app_pete_iphone', 'notify.mobile_app_pat_iphone']"
      selector:
        object:
    quiet_hours_start:
      name: Quiet hours start
      description: "Format HH:MM (24h). Default 22:00."
      required: false
      example: "22:00"
      selector:
        text:
    quiet_hours_end:
      name: Quiet hours end
      description: "Format HH:MM (24h). Default 07:00."
      required: false
      example: "07:00"
      selector:
        text:
    enabled:
      name: Notifications enabled
      description: Master on/off for push notifications.
      required: false
      selector:
        boolean:
    low_moisture_alerts:
      name: Daily low-moisture summary
      description: Once a day at quiet-hours-end, send a summary if any zone has a moisture sensor below its configured min%.
      required: false
      default: true
      selector:
        boolean:

test_notification:
  name: Test notification
  description: Push a test notification to confirm your routing works.
  fields:
    message:
      name: Message
      required: false
      default: "Test"
      selector:
        text:
