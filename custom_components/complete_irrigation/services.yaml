run_zone:
  name: Run zone
  description: >
    Run an irrigation zone manually for the specified number of minutes.
    Turns the zone's underlying switch on, then off after the duration
    elapses. If the switch is turned off externally before the
    duration, the auto-stop is cancelled.
  fields:
    entity_id:
      name: Zone switch
      description: The zone switch entity to run.
      required: true
      selector:
        entity:
          domain: switch
    minutes:
      name: Duration (minutes)
      description: >
        How long to run the zone. Default 10 min. Hard cap 480 min (8 hours).
        Runs longer than the controller's per-activation cap
        (controller_max_run_minutes, default 58) are delivered automatically
        as back-to-back blocks with a short gap between them.
      required: false
      default: 10
      example: 15
      selector:
        number:
          min: 1
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min

stop_zone:
  name: Stop zone
  description: >
    Stop a currently-running zone. If the zone was started via run_zone,
    cancels the pending auto-stop. Otherwise just turns the switch off.
  fields:
    entity_id:
      name: Zone switch
      description: The zone switch entity to stop.
      required: true
      selector:
        entity:
          domain: switch

add_schedule:
  name: Add schedule
  description: >
    Create a new recurring irrigation schedule. Persists across HA restarts.
  fields:
    name:
      name: Schedule name
      description: A human-friendly label for this schedule.
      required: true
      example: "Morning Front Lawn"
      selector:
        text:
    zone_entity_id:
      name: Zone
      description: The zone switch this schedule will run.
      required: true
      selector:
        entity:
          domain: switch
    start_time:
      name: Start time
      description: Time of day to start the run (24-hour, local time).
      required: true
      example: "06:00"
      selector:
        time:
    duration_minutes:
      name: Duration (minutes)
      description: How long the run lasts. Hard cap 480 min (8 hours).
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min
    weekdays:
      name: Weekdays (weekdays mode only)
      description: "Days of the week to run (0=Mon..6=Sun, ISO). Required when mode is 'weekdays'."
      required: false
      example: "[0, 1, 2, 3, 4]"
      selector:
        object:
    enabled:
      name: Enabled
      description: Whether the schedule fires (default true).
      required: false
      default: true
      selector:
        boolean:
    mode:
      name: Recurrence mode
      description: >
        weekdays = fires on listed days each week;
        interval = fires every N days from a start date;
        interval_hours = fires every N hours from anchor date + start_time, across day boundaries.
      required: false
      default: weekdays
      selector:
        select:
          options: ["weekdays", "interval", "interval_hours"]
    interval_days:
      name: Interval (days)
      description: "For interval mode: fire every N days. e.g. 5 = every 5 days."
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
    interval_hours:
      name: Interval (hours)
      description: "For interval_hours mode: fire every N hours. e.g. 6 = every 6 hours."
      required: false
      example: 6
      selector:
        number:
          min: 1
          max: 72
          step: 1
          mode: box
    interval_anchor:
      name: First run date
      description: "For interval / interval_hours mode: date of the first run. Subsequent runs step from there."
      required: false
      selector:
        date:
    start_date:
      name: Active period — start date
      description: Schedule won't fire before this date. Omit for "start now".
      required: false
      selector:
        date:
    end_date:
      name: Active period — end date
      description: Schedule stops firing after this date. Omit for "never end".
      required: false
      selector:
        date:
    repeat_annually:
      name: Repeat every year
      description: >
        When true, treat the start/end dates' month-day as a seasonal
        window applied each year (e.g. Mar 1 – Oct 31 yearly). Both
        dates required; window must not wrap across year-end.
      required: false
      default: false
      selector:
        boolean:
    zone_steps:
      name: Additional zones (multi-zone mode)
      description: >
        Optional list of {zone_entity_id, duration_minutes} dicts. If
        provided, the schedule fires zones in order, back-to-back at
        run time (each waits for the previous to finish plus the
        configured inter-zone buffer - zone_buffer_seconds, default
        30 s). The first entry must match `zone_entity_id` +
        `duration_minutes`. Per-zone moisture gating still applies, so
        any sensor-saturated zone in the sequence is skipped.
      required: false
      example: "[{zone_entity_id: switch.front_lawn, duration_minutes: 15}, {zone_entity_id: switch.back_lawn, duration_minutes: 10}]"
      selector:
        object:
    sun_event:
      name: Sun event
      description: Anchor the start to sunrise or sunset (empty = fixed time).
      required: false
      selector:
        select:
          options:
            - sunrise
            - sunset
    sun_offset_minutes:
      name: Sun offset (minutes)
      description: Offset from the sun event (negative = before).
      required: false
      selector:
        number:
          min: -240
          max: 240
          step: 1
          mode: box
    anchor:
      name: Anchor
      description: start = begin at the resolved time; finish = COMPLETE at it.
      required: false
      selector:
        select:
          options:
            - start
            - finish
    interval_end_time:
      name: Daily window end (interval_hours mode)
      description: >
        Optional daily-window cap, interval_hours mode only. When set, the
        schedule fires every N hours from start_time ON EACH DAY
        (re-anchored daily, not continuous across midnight); the last
        firing of a day is the latest one starting at or before this
        time. Must be after start_time. Omit for the continuous-from-
        anchor behavior.
      required: false
      example: "18:00"
      selector:
        time:
    ignore_wind:
      name: Ignore wind defer
      description: This schedule runs even when the wind-defer gate would skip it (default false).
      required: false
      default: false
      selector:
        boolean:
    ignore_hot_weather:
      name: Ignore hot-weather boost
      description: Skip the hot-weather runtime boost for this schedule (default false).
      required: false
      default: false
      selector:
        boolean:
    ignore_rain_lockout:
      name: Ignore rain lockout
      description: This schedule runs even during a rain lockout (default false).
      required: false
      default: false
      selector:
        boolean:
    color:
      name: Color
      description: >
        Display color for this schedule in the panel and calendar, as a
        "#rrggbb" hex string. Empty/null = no color.
      required: false
      example: "#4caf50"
      selector:
        text:

