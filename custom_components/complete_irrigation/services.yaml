        time:
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min
    weekdays:
      required: false
      selector:
        object:
    enabled:
      required: false
      selector:
        boolean:
    mode:
      required: false
      selector:
        select:
          options: ["weekdays", "interval", "interval_hours"]
    interval_days:
      required: false
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
    interval_hours:
      required: false
      selector:
        number:
          min: 1
          max: 72
          step: 1
          mode: box
    interval_anchor:
      required: false
      selector:
        date:
    start_date:
      required: false
      selector:
        date:
    end_date:
      required: false
      selector:
        date:
    repeat_annually:
      required: false
      selector:
        boolean:
    zone_steps:
      required: false
      selector:
        object:
    sun_event:
      name: Sun event
      description: Anchor the start to sunrise or sunset (empty = fixed time).
      required: false
      selector:
        select:
          options:
            - sunrise
            - sunset
    sun_offset_minutes:
      name: Sun offset (minutes)
      description: Offset from the sun event (negative = before).
      required: false
      selector:
        number:
          min: -240
          max: 240
          step: 1
          mode: box
    anchor:
      name: Anchor
      description: start = begin at the resolved time; finish = COMPLETE at it.
      required: false
      selector:
        select:
          options:
            - start
            - finish
    interval_end_time:
      name: Daily window end (interval_hours mode)
      description: >
        Optional daily-window cap, interval_hours mode only. Firings
        re-anchor from start_time each day; the last firing of a day
        starts at or before this time. Must be after start_time.
      required: false
      example: "18:00"
      selector:
        time:
    ignore_wind:
      name: Ignore wind defer
      description: This schedule runs even when the wind-defer gate would skip it.
      required: false
      selector:
        boolean:
    ignore_hot_weather:
      name: Ignore hot-weather boost
      description: Skip the hot-weather runtime boost for this schedule.
      required: false
      selector:
        boolean:
    ignore_rain_lockout:
      name: Ignore rain lockout
      description: This schedule runs even during a rain lockout.
      required: false
      selector:
        boolean:
    color:
      name: Color
      description: >
        Display color for this schedule in the panel and calendar, as a
        "#rrggbb" hex string. Empty/null = no color.
      required: false
      example: "#4caf50"
      selector:
        text:

delete_schedule:
  name: Delete schedule
  description: Permanently remove a schedule by id.
  fields:
    schedule_id:
      name: Schedule ID
      description: The id of the schedule to delete.
      required: true
      selector:
        text:

set_schedule_enabled:
  name: Set schedule enabled
  description: Toggle a schedule on or off without deleting it.
  fields:
    schedule_id:
      name: Schedule ID
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

set_weather_config:
  name: Set weather config
  description: >
    Configure rain lockout + hot weather boost. All fields optional —
    only the ones you pass are updated.
  fields:
    rain_sensor:
      name: Rain sensor (legacy)
      description: "Single rainfall sensor (in inches). A rolling-window sensor (e.g. last 6h) is ideal; a daily-total accumulator also works — lockout arms on NEW rainfall (a rising reading), not while the total merely stays elevated. Prefer `rain_sensors` for multi-sensor setups."
      required: false
      selector:
        entity:
          domain: sensor
    rain_sensors:
      name: Rain sensors
      description: "One or more rainfall sensors (in inches). The first is used for lockout, which arms on a rising reading (new rain) so a daily-total accumulator can't pin the lockout on; all show on the Today banner."
      required: false
      example: "['sensor.backyard_rain_accumulation_today', 'sensor.backyard_rain_intensity']"
      selector:
        object:
    temperature_sensor:
      name: Temperature sensor
      description: Sensor reporting current outdoor temperature in °F (for hot weather boost).
      required: false
      selector:
        entity:
          domain: sensor
    hot_threshold_f:
      name: Hot weather threshold (°F)
      description: >
        Boost runtime when the forecast high meets or exceeds this value.
        No default - leaving it unset disables the hot-weather boost
        entirely.
      required: false
      example: 100
      selector:
        number:
          min: 50
          max: 130
          step: 1
          mode: box
    boost_percent:
      name: Hot weather boost (%)
      description: >
        Increase runtime by this percent on hot days. No default - when
        unset it is treated as 0 (no boost applied).
      required: false
      example: 25
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    wind_sensor:
      name: Wind sensor (optional)
      description: Sensor reporting current wind speed (mph). If omitted, falls back to any `weather.*` entity's `wind_speed` attribute.
      required: false
      selector:
        entity:
          domain: sensor
    wind_defer_mph:
      name: Wind defer threshold (mph)
      description: Skip scheduled runs when current wind ≥ this many mph. 0 disables wind defer entirely.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 80
          step: 1
          mode: box
    eto_in_week:
      name: Reference ET (inches/week)
      description: Manual reference evapotranspiration driving the plant water calculator. When auto ET is on this is the fallback used if the forecast can't be read.
      required: false
      default: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box
    eto_auto:
      name: Auto reference ET (from weather)
      description: Compute reference ET daily from the weather forecast (FAO-56 Penman-Monteith, with a temperature-only fallback). Falls back to the manual eto_in_week when the forecast is unavailable or stale.
      required: false
      default: false
      selector:
        boolean:
    weather_entity:
      name: Weather entity (for auto ET)
      description: The weather.* entity to pull the daily forecast from for auto ET. If omitted, the first available weather entity is used. Only used when eto_provider is "ha".
      required: false
      selector:
        entity:
          domain: weather
    eto_provider:
      name: Auto-ET source
      description: >
        Where auto reference ET comes from. "ha" (default) computes FAO-56 from a
        Home Assistant weather entity. "open_meteo" fetches FAO ET0 directly from
        the free, keyless Open-Meteo API using your Home Assistant latitude /
        longitude - no weather entity and no API key required.
      required: false
      default: ha
      selector:
        select:
          options: ["ha", "open_meteo"]
    drip_efficiency:
      name: Drip efficiency
      description: Irrigation application efficiency (0.5-1.0) used by the plant water calculator. Drip is typically ~0.9.
      required: false
      default: 0.9
      selector:
        number:
          min: 0.5
          max: 1.0
          step: 0.05
          mode: box
    rain_lockout_min_inches:
      name: Rain lockout minimum (inches)
      description: >
        Rainfall below this never triggers a lockout (0 = disabled). Set e.g. 0.5
        so brief desert cells that drop a fraction of an inch don't pause watering
        in summer heat.
      required: false
      selector:
        number:
          min: 0
          max: 5
          step: 0.05
          mode: box
set_zone_moisture:
  name: Set zone moisture config
  description: >
    Bind moisture sensor(s) to a zone with min / target / max thresholds
    and a combine mode. Required for sensor-driven runtime adjustment.
    WARNING - each call REPLACES the zone's entire moisture config (it
    does not merge): re-running with only some fields silently resets the
    omitted ones (fail-closed, auto-soak, exclusions, ...), so pass every
    setting you want to keep on every call.
  fields:
    zone_entity_id:
      name: Zone switch
      required: true
      selector:
        entity:
          domain: switch
    moisture_entities:
      name: Moisture sensors
      description: One or more moisture % sensors for this zone.
      required: true
      selector:
        object:
    combine_mode:
      name: Combine mode (multiple sensors)
      description: How to combine multiple sensor readings.
      required: false
      default: average
      selector:
        select:
          options: ["average", "lowest", "highest", "primary"]
    min_pct:
      name: Minimum moisture (%)
      description: Below this — urgent boost. Default 21% (lawn).
      required: false
      default: 21
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    target_pct:
      name: Target moisture (%)
      description: Default 31% (lawn).
      required: false
      default: 31
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    max_pct:
      name: Maximum moisture (%)
      description: Above this — skip the run (saturated). Default 40% (lawn).
      required: false
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    category:
      name: Plant category
      description: "Optional label for grouping (lawn, vegetable_garden, bushes, citrus, trees, custom)."
      required: false
      selector:
        text:
    temperature_entities:
      name: Temperature sensors (optional)
      description: One or more temperature sensors for this zone (display-only; averaged when multiple).
      required: false
      example: "['sensor.front_yard_temperature']"
      selector:
        object:
    humidity_entities:
      name: Humidity sensors (optional)
      description: One or more humidity sensors for this zone (display-only; averaged when multiple).
      required: false
      example: "['sensor.front_yard_humidity']"
      selector:
        object:
    require_moisture_reading:
      name: Require moisture reading (fail-closed)
      description: >
        Skip a scheduled run when NO moisture reading is available for
        this zone (all sensors offline / unavailable). Default off =
        legacy fail-open (water anyway).
      required: false
      selector:
        boolean:
    moisture_disabled:
      name: Moisture disabled
      description: >
        Ignore moisture entirely for watering decisions on this zone.
        Sensors stay bound for display (chips / tile stats) but the
        moisture gate becomes a no-op - no saturated-skip, no runtime
        adjustment. Default off.
      required: false
      selector:
        boolean:
    moisture_excluded:
      name: Moisture sensors excluded from analysis
      description: >
        Sensors listed here stay bound for DISPLAY but are excluded from
        the combine/average used by the moisture gate and auto-soak. For
        sensors that consistently read wrong and skew the math.
      required: false
      example: "['sensor.front_yard_moisture_2']"
      selector:
        object:
    auto_soak_enabled:
      name: Auto-soak recovery
      description: >
        When the zone's effective moisture drops below min_pct - run
        soak_run_minutes, wait soak_wait_minutes for absorption, re-read,
        repeat until moisture recovers or soak_max_cycles is hit (then
        notify + cooldown so a stuck-low sensor can't water forever).
      required: false
      selector:
        boolean:
    soak_run_minutes:
      name: Soak run (minutes)
      description: Length of each auto-soak watering cycle.
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
          unit_of_measurement: min
    soak_wait_minutes:
      name: Soak wait (minutes)
      description: Absorption wait between auto-soak cycles before re-reading moisture.
      required: false
      example: 30
      selector:
        number:
          min: 5
          max: 240
          step: 1
          mode: box
          unit_of_measurement: min
    soak_max_cycles:
      name: Soak max cycles
      description: Stop auto-soak after this many cycles even if moisture stays low.
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box

clear_rain_lockout:
  name: Clear rain lockout
  description: Manually end the current rain lockout (schedules resume immediately).

set_general_config:
  name: Set general integration config
  description: >
    Bucket for one-off global settings. All fields optional — only the ones
    you pass are updated.
  fields:
    zone_buffer_seconds:
      name: Inter-zone buffer (seconds)
      description: Valve-settle gap between back-to-back zones in a multi-zone schedule. Default 30.
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 600
          step: 1
          mode: box
    weekly_reminder_snoozed_until:
      name: Snooze weekly reminder until (date)
      description: >
        Suppress the Sunday weekly reminder until this date. Set to null
        (or omit) to resume.
      required: false
      selector:
        date:
    zone_order:
      name: Zone display order
      description: >
        Ordered list of zone entity_ids. Controls the order zones appear
        on the Today and Zones tabs. Zones added later via the config
        flow but not yet listed here are appended at the bottom.
      required: false
      example: "['switch.front_lawn', 'switch.back_yard', 'switch.garden']"
      selector:
        object:
    map_export_url_template:
      name: Yard map aerial source (URL template)
      description: >
        Custom aerial for the yard map. The default (blank) is Esri World Imagery,
        which is coarse at yard scale — it won't render sharper than ~0.3 m/px, so
        a small yard is fetched tiny and upscaled. Many county assessors / city GIS
        offices publish much sharper orthophotos as a keyless ArcGIS export. Tokens:
        {bbox} (or {west}/{south}/{east}/{north}) plus {width} and {height}. Also
        editable in Settings → Yard map imagery. Blank restores Esri.
      required: false
      example: "https://gis.example.gov/arcgis/rest/services/Imagery/Aerials2026/MapServer/export?bbox={bbox}&bboxSR=4326&imageSR=4326&size={width},{height}&format=jpg&f=image"
      selector:
        text:
    vision_url:
      name: Vision endpoint URL (local)
      description: >
        OpenAI-compatible chat-completions endpoint for the LOCAL plant-ID
        vision model (e.g. Ollama / vLLM on a LAN GPU box). Empty string
        clears it.
      required: false
      example: "http://192.168.1.10:8000/v1/chat/completions"
      selector:
        text:
    vision_model:
      name: Vision model (local)
      description: Model name the local vision endpoint should run.
      required: false
      example: "qwen2.5vl:7b"
      selector:
        text:
    llm_mode:
      name: Plant-ID model mode
      description: >
        Which endpoint(s) plant identification uses. local = local vision
        endpoint only; external = external provider only; fallback = try
        local first, then the external provider as the safety net. An
        endpoint that isn't fully configured is skipped.
      required: false
      example: "local"
      selector:
        select:
          options: ["local", "external", "fallback"]
    llm_provider:
      name: External LLM provider
      description: >
        Preset for the external plant-ID provider. Picking one supplies the
        base URL automatically; custom = any other OpenAI-compatible server
        (you supply llm_external_url + llm_external_model yourself).
      required: false
      example: "anthropic"
      selector:
        select:
          options: ["anthropic", "xai", "google", "custom"]
    llm_external_url:
      name: External LLM URL
      description: >
        Base URL of the external provider's OpenAI-compatible
        chat-completions endpoint. An explicit value overrides the
        provider preset; leave blank to use the preset's URL. Required
        for provider = custom.
      required: false
      example: "https://api.anthropic.com/v1/chat/completions"
      selector:
        text:
    llm_external_model:
      name: External LLM model
      description: Model id to request from the external provider.
      required: false
      example: "claude-sonnet-5"
      selector:
        text:
    llm_external_api_key:
      name: External LLM API key
      description: >
        API key for the external provider. Stored on the Home Assistant
        server only - it is never returned to the browser and never
        logged. Empty string clears it.
      required: false
      selector:
        text:
    admin_only_services:
      name: Admin-only services
      description: >
        When true, every data-mutating / hardware-actuating service call
        (run_zone, stop_zone, add/update/delete_schedule, etc.) requires
        the calling user to be an HA admin. Default false.
      required: false
      selector:
        boolean:
    controller_max_run_minutes:
      name: Controller max run (minutes)
      description: >
        Controller per-activation cap = the block size for long-run
        chunking. Default 58 (two minutes under Rachio's 60-min manual-run
        limit); tune only if your controller's limit differs.
      required: false
      example: 58
      selector:
        number:
          min: 5
          max: 480
          step: 1
          mode: box
          unit_of_measurement: min
    block_gap_seconds:
      name: Block gap (seconds)
      description: >
        Gap between back-to-back blocks of a chunked long run - long
        enough for the controller to register the off and reset. Default 30.
      required: false
      example: 30
      selector:
        number:
          min: 5
          max: 600
          step: 1
          mode: box
          unit_of_measurement: s
    verify_switch_seconds:
      name: Verify switch (seconds)
      description: >
        "Check back" window for valve-actuation verification: after
        commanding a zone switch on/off, re-read its state this many
        seconds later and retry/alert if the command didn't take.
        0 disables the check. Default 30.
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: box
          unit_of_measurement: s

start_establishment:
  name: Start "new grass" establishment mode
  description: >
    Create a bounded, auto-expiring multi-cycle watering schedule for a freshly
    seeded/sodded zone — short cycles several times a day, spread across a
    12-hour daytime window, ending automatically after `days`. Also available as
    the 🌱 button on the Zones tab.
  fields:
    zone_entity_id:
      name: Zone
      description: The zone switch that was reseeded.
      required: true
      selector:
        entity:
          domain: switch
    cycles_per_day:
      name: Cycles per day
      description: How many short waterings per day (spread over a 12-hour daytime window).
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    minutes_per_cycle:
      name: Minutes per cycle
      description: Duration of each individual cycle.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    days:
      name: Days
      description: How long establishment lasts. The schedules auto-expire after this.
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    start_hour:
      name: Start hour
      description: Hour of the first cycle (0-23, local time).
      required: false
      default: 6
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box

duplicate_plant:
  name: Duplicate a plant
  description: >
    Copy an existing plant — species, water-use, canopy, zone, drip setup and care
    attributes — WITHOUT its photos, map position, or health history. Handy for a
    row of identical shrubs. Returns the new plant's id in the response.
  fields:
    plant_id:
      name: Plant
      description: The id of the plant to copy (see the Yard tab / list_plants).
      required: true
      selector:
        text:

research_plant_species:
  name: Research a species by name
  description: >
    Look up care details for a species you name yourself (no photo needed) and
    apply them to the plant, keeping your species text and canopy. Checks the
    curated low-desert care table FIRST (accurate + offline); only falls back to
    the configured plant-ID model for species it doesn't cover.
  fields:
    plant_id:
      name: Plant
      description: The plant to apply the researched care to.
      required: true
      selector:
        text:
    species:
      name: Species
      description: >
        Scientific or common name, e.g. "Leucophyllum frutescens" or "Texas Ranger".
        Leave blank to use the species already on the plant.
      required: false
      example: "Leucophyllum frutescens"
      selector:
        text:

propose_watering_advice:
  name: Store watering-advisor proposals
  description: >
    ADVISORY ONLY — used by the external watering-advisor job
    (tools/watering_advisor_job.py). Stores rail-validated proposals for display
    in the panel's 🤖 advisor card. Nothing here changes watering: each item is
    applied later by YOU, through the same validated services you use manually.
  fields:
    advice:
      name: Advice payload
      description: The advisor's proposal object (bounded + validated server-side).
      required: true
      selector:
        object:
    model:
      name: Model name
      description: Which model produced the proposals (shown on the card).
      required: false
      example: "qwen2.5:14b"
      selector:
        text:

dismiss_watering_advice:
  name: Dismiss watering advice
  description: Clear all stored watering-advisor proposals from the panel.

lookup_hardiness_zone:
  name: Look up USDA hardiness zone (phzmapi)
  description: >
    Look up the USDA plant-hardiness zone for a US ZIP code via phzmapi.org
    (no API key, no LLM). Stores the zone + its frost temperature so the Yard tab
    can show it and flag frost-tender plants. Sends only the ZIP.
  fields:
    zip:
      name: ZIP code
      description: US 5-digit ZIP code.
      required: true
      example: "85295"
      selector:
        text:

verify_species_name:
  name: Verify a species name (GBIF)
  description: >
    Check a typed plant name against GBIF's open taxonomy (no API key, no LLM)
    and return the accepted scientific name plus typo corrections / suggestions.
    Used by the "Verify" button in the plant editor so a manual add can confirm
    the name. Name only - water-use still comes from the curated care table.
  fields:
    name:
      name: Plant name
      description: The species (scientific or common) to verify.
      required: true
      example: "Leucophyllum frutescens"
      selector:
        text:

set_conflict_policy:
  name: Set schedule-conflict policy
  description: >
    When two schedules' run windows overlap, this picks how the coordinator
    resolves them. Default is `defer_new` (skip the new one).
  fields:
    policy:
      name: Policy
      description: >
        defer_new = new run skipped; shift_existing = move existing earlier
        to make room; split_difference = move both equally apart.
      required: true
      selector:
        select:
          options:
            - "defer_new"
            - "shift_existing"
            - "split_difference"

set_notification_config:
  name: Set notification config
  description: Configure where to push notifications + quiet hours window.
  fields:
    notify_target:
      name: Notify target service (single, legacy)
      description: "Format: notify.<service> (e.g., notify.mobile_app_pete_iphone). Prefer `notify_targets` to send to multiple devices."
      required: false
      selector:
        text:
    notify_targets:
      name: Notify target services (multi)
      description: "List of notify.<service> entries (or a comma-separated string). Each notification fans out to every entry."
      required: false
      example: "['notify.mobile_app_pete_iphone', 'notify.mobile_app_pat_iphone']"
      selector:
        object:
    quiet_hours_start:
      name: Quiet hours start
      description: "Format HH:MM (24h). Default 22:00."
      required: false
      example: "22:00"
      selector:
        text:
    quiet_hours_end:
      name: Quiet hours end
      description: "Format HH:MM (24h). Default 07:00."
      required: false
      example: "07:00"
      selector:
        text:
    enabled:
      name: Notifications enabled
      description: Master on/off for push notifications.
      required: false
      selector:
        boolean:
    low_moisture_alerts:
      name: Daily low-moisture summary
      description: Once a day at quiet-hours-end, send a summary if any zone has a moisture sensor below its configured min%.
      required: false
      default: true
      selector:
        boolean:
    notify_on_missed:
      name: Missed-run notifications
      description: >
        When a scheduled run is dropped (conflict resolver, moisture /
        wind / rain gate, or missed due to an HA restart), send a
        notification with a "Run now" action so the run can be recovered
        with one tap. Default on.
      required: false
      selector:
        boolean:
    notify_on_aborted:
      name: Aborted-run notifications
      description: >
        When a scheduled run is cut short by an external actor (something
        other than the integration's auto-stop turns the switch off),
        notify with "Run remainder" + "Open Logbook" actions. Default on.
      required: false
      selector:
        boolean:

test_notification:
  name: Test notification
  description: Push a test notification to confirm your routing works.
  fields:
    message:
      name: Message
      required: false
      default: "Test"
      selector:
        text:

clear_run_history:
  name: Clear run history
  description: Delete every run-history record. Cannot be undone.

run_schedule:
  name: Run schedule now
  description: >
    Execute a schedule's full run sequence on demand. Multi-zone schedules
    fire each zone in order with the configured inter-zone buffer between
    steps. Bypasses moisture / wind / hot-weather / rain-lockout gates
    (manual override semantics — the user clicked Run, they meant it).
  fields:
    schedule_id:
      name: Schedule ID
      description: The id of the schedule to run (from complete_irrigation/list_schedules).
      required: true
      selector:
        text:

# ── v2: plant-aware irrigation ──────────────────────────────────────
add_plant:
  name: Add plant
  description: >
    Register a plant in the yard and attach it to a zone (drip loop). Used by
    the per-loop water calculator to recommend emitters. Persists across HA
    restarts.
  fields:
    name:
      name: Plant name
      description: A human-friendly label for this plant.
      required: true
      example: "Lemon tree"
      selector:
        text:
    wucols_category:
      name: Water-use category
      description: WUCOLS landscape water-use category (sets the plant factor).
      required: true
      example: "high"
      selector:
        select:
          options:
            - very_low
            - low
            - moderate
            - high
    canopy_area_sqft:
      name: Canopy area (sq ft)
      description: Approximate planted/canopy area the plant covers.
      required: true
      example: 100
      selector:
        number:
          min: 0.1
          max: 100000
          mode: box
          unit_of_measurement: "ft²"
    zone_entity_id:
      name: Zone / loop
      description: The switch entity (irrigation zone) this plant is watered by.
      required: true
      selector:
        entity:
          domain: switch
    species:
      name: Species
      description: Optional scientific or common species name (free text).
      required: false
      example: "Leucophyllum frutescens"
      selector:
        text:

update_plant:
  name: Update plant
  description: Change one or more fields of an existing plant.
  fields:
    plant_id:
      name: Plant ID
      description: The id of the plant to update.
      required: true
      selector:
        text:
    name:
      name: Plant name
      required: false
      selector:
        text:
    wucols_category:
      name: Water-use category
      required: false
      selector:
        select:
          options:
            - very_low
            - low
            - moderate
            - high
    canopy_area_sqft:
      name: Canopy area (sq ft)
      required: false
      selector:
        number:
          min: 0.1
          max: 100000
          mode: box
          unit_of_measurement: "ft²"
    zone_entity_id:
      name: Zone / loop
      required: false
      selector:
        entity:
          domain: switch
    map_x:
      name: Map X (0-1)
      description: Normalized yard-map position from the west edge (set by dragging the marker).
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box
    map_y:
      name: Map Y (0-1)
      description: Normalized yard-map position from the north edge (set by dragging the marker).
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box
    species:
      name: Species
      description: Scientific or common species name (free text).
      required: false
      example: "Leucophyllum frutescens"
      selector:
        text:
    emitter_count:
      name: Drip count
      description: >
        Number of drip emitters on this plant. Set together with
        emitter_gph - a one-sided pair is rejected.
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    emitter_gph:
      name: Drip size (GPH)
      description: >
        Gallons per hour of each emitter. Set together with
        emitter_count - a one-sided pair is rejected.
      required: false
      example: 2
      selector:
        number:
          min: 0.1
          max: 50
          step: any
          mode: box
    clear_emitters:
      name: Clear emitters
      description: Set true to remove the plant's installed drip emitters (both fields unset).
      required: false
      default: false
      selector:
        boolean:

delete_plant:
  name: Delete plant
  description: Permanently remove a plant by id.
  fields:
    plant_id:
      name: Plant ID
      description: The id of the plant to delete.
      required: true
      selector:
        text:

set_yard_map:
  name: Set yard map
  description: >
    Fetch an aerial image of the property (Esri World Imagery, no API key) and cache it
    as the yard-map backdrop. Centers on your Home Assistant location unless you pass
    coordinates. The plant markers are positioned over this image.
  fields:
    latitude:
      name: Center latitude
      description: Defaults to your Home Assistant latitude.
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Center longitude
      description: Defaults to your Home Assistant longitude.
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    span_m:
      name: Span (meters)
      description: Width/height of the area to capture, in meters (default 60).
      required: false
      selector:
        number:
          min: 10
          max: 500
          step: 5
          mode: box
          unit_of_measurement: "m"

add_plant_photo:
  name: Add plant photo
  description: >
    Attach a photo to a plant (for biannual LLM-vision health checks). The image is
    base64-encoded; the panel downsizes it first. If latitude/longitude (the photo's
    EXIF GPS) are given and the plant isn't placed on the yard map yet, its marker is
    auto-placed from the GPS (you can drag to correct).
  fields:
    plant_id:
      name: Plant ID
      description: The id of the plant to attach the photo to.
      required: true
      selector:
        text:
    image_base64:
      name: Image (base64)
      description: "The JPEG image, base64-encoded (a data-URL prefix is tolerated)."
      required: true
      selector:
        text:
          multiline: true
    latitude:
      name: Photo latitude (EXIF)
      description: Optional. Used to auto-place an unplaced plant on the yard map.
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Photo longitude (EXIF)
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    note:
      name: Note
      description: Optional short note for this photo.
      required: false
      selector:
        text:

set_plant_health:
  name: Set plant health (vision verdict)
  description: >
    Store a biannual vision-health verdict for a plant (posted by the external
    vision job). The verdict is bounded by the integration's safety rail before it is
    saved. Advisory only — it never changes watering.
  fields:
    plant_id:
      name: Plant ID
      description: The id of the plant this verdict is for.
      required: true
      selector:
        text:
    verdict:
      name: Verdict
      description: >
        The vision model's result as an object, e.g.
        {health_state: healthy, confidence: 0.9, changes_since_last: "...",
        concerns: [...], suggested_care: [...]}.
      required: true
      selector:
        object:
    model:
      name: Model
      description: Optional name of the vision model that produced the verdict.
      required: false
      selector:
        text:

set_plant_light_range:
  name: Set plant light range
  description: >
    Set (or clear) a plant's optimal illuminance range in lux. Light surveys are
    verdicted against this range ("too little / optimal / too much light").
  fields:
    plant_id:
      name: Plant ID
      description: The id of the plant.
      required: true
      selector:
        text:
    lux_low:
      name: Lux low
      description: Lower bound of the optimal range (lux). Set together with lux_high.
      required: false
      selector:
        number:
          min: 1
          max: 200000
          step: any
          mode: box
    lux_high:
      name: Lux high
      description: Upper bound of the optimal range (lux). Set together with lux_low.
      required: false
      selector:
        number:
          min: 1
          max: 200000
          step: any
          mode: box
    clear:
      name: Clear
      description: Set true to remove the plant's light range instead.
      required: false
      selector:
        boolean:

start_light_survey:
  name: Start light survey
  description: >
    Sample an illuminance sensor placed at a plant for a timed window; the summarized
    reading is stored on the plant and verdicted against its optimal lux range.
    Designed for a roaming sensor stake you move from plant to plant.
  fields:
    plant_id:
      name: Plant ID
      description: The plant the sensor is placed at.
      required: true
      selector:
        text:
    sensor_entity_id:
      name: Illuminance sensor
      description: The lux sensor entity to sample.
      required: true
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    minutes:
      name: Minutes
      description: Survey length in minutes (sampled about once a minute).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 240
          step: 1
          mode: box

cancel_light_survey:
  name: Cancel light survey
  description: Cancel a running light survey for a plant (nothing is stored).
  fields:
    plant_id:
      name: Plant ID
      description: The plant whose survey to cancel.
      required: true
      selector:
        text:

add_care_task:
  name: Add care task
  description: >
    Add a recurring care reminder (fertilize / prune / mulch / inspect / custom)
    for a plant or a zone. A due task notifies (and re-nags weekly) until marked done.
  fields:
    kind:
      name: Kind
      description: The kind of care.
      required: true
      selector:
        select:
          options:
            - fertilize
            - prune
            - mulch
            - inspect
            - custom
    interval_days:
      name: Interval (days)
      description: How often this care is due.
      required: true
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
    plant_id:
      name: Plant ID
      description: The plant this task is for (or use zone_entity_id instead).
      required: false
      selector:
        text:
    zone_entity_id:
      name: Zone
      description: The zone this task is for (or use plant_id instead).
      required: false
      selector:
        entity:
          domain: switch
    label:
      name: Label
      description: Display label (required for kind = custom).
      required: false
      selector:
        text:

update_care_task:
  name: Update care task
  description: Update a care task's kind, interval, label, or enabled state.
  fields:
    task_id:
      name: Task ID
      description: The id of the care task.
      required: true
      selector:
        text:
    kind:
      name: Kind
      description: New kind.
      required: false
      selector:
        select:
          options:
            - fertilize
            - prune
            - mulch
            - inspect
            - custom
    interval_days:
      name: Interval (days)
      description: New interval.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box
    label:
      name: Label
      description: New display label.
      required: false
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable or disable the reminder.
      required: false
      selector:
        boolean:

delete_care_task:
  name: Delete care task
  description: Delete a care task permanently.
  fields:
    task_id:
      name: Task ID
      description: The id of the care task to delete.
      required: true
      selector:
        text:

complete_care_task:
  name: Complete care task
  description: Mark a care task done now — its next reminder re-arms from today.
  fields:
    task_id:
      name: Task ID
      description: The id of the care task to mark done.
      required: true
      selector:
        text:

seed_care_plan:
  name: Seed care plan
  description: >
    One-tap starter care plan for a plant — creates the preset's fertilize /
    prune / mulch / inspect reminders (skipping kinds the plant already has).
    Edit the intervals afterwards to taste.
  fields:
    plant_id:
      name: Plant ID
      description: The plant to seed a plan for.
      required: true
      selector:
        text:
    preset:
      name: Preset
      description: The plant type whose starter cadences to apply.
      required: true
      selector:
        select:
          options:
            - tree
            - shrub
            - flower
            - cactus_succulent
            - grass

identify_plant_species:
  name: Identify plant species (photo)
  description: >
    Send the plant's newest photo to your configured local vision endpoint
    (set_general_config vision_url/vision_model) and store a bounded species +
    care-sheet SUGGESTION on the plant. Nothing is applied until you accept it.
  fields:
    plant_id:
      name: Plant ID
      description: The plant to identify (must have at least one photo).
      required: true
      selector:
        text:

apply_species_suggestion:
  name: Apply species suggestion
  description: >
    Accept a pending species suggestion — sets the plant's species, maps the
    sunlight class to its optimal-lux range, applies a suggested WUCOLS category,
    and (optionally) seeds the starter care plan.
  fields:
    plant_id:
      name: Plant ID
      description: The plant with a pending suggestion.
      required: true
      selector:
        text:
    seed_plan:
      name: Seed care plan
      description: Also create the suggested starter care tasks (default on).
      required: false
      default: true
      selector:
        boolean:
    apply_canopy:
      name: Apply estimated canopy
      description: >
        Also apply the photo-estimated canopy area (photo-first flow
        only). Off by default so accepting a suggestion never clobbers a
        user-entered canopy - this is the only way to accept the
        estimate.
      required: false
      default: false
      selector:
        boolean:

dismiss_species_suggestion:
  name: Dismiss species suggestion
  description: Discard a pending species suggestion without applying anything.
  fields:
    plant_id:
      name: Plant ID
      description: The plant whose suggestion to discard.
      required: true
      selector:
        text:

add_plant_from_photo:
  name: Add plant from photo
  description: >
    Photo-first plant creation: give the zone it's on (plus optionally its drip
    emitters), attach a photo, and the vision model fills the rest — name,
    species, water-use category, canopy estimate, light range — and seeds the
    starter care plan. Everything stays editable afterwards.
  fields:
    zone_entity_id:
      name: Zone
      description: The irrigation zone/loop this plant is watered by.
      required: true
      selector:
        entity:
          domain: switch
    image_base64:
      name: Photo (base64)
      description: The plant photo, base64-encoded JPEG.
      required: true
      selector:
        text:
    latitude:
      name: Latitude
      description: Optional EXIF GPS latitude (auto-places the map marker).
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      description: Optional EXIF GPS longitude.
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    name:
      name: Name
      description: Optional name override (defaults to the identified common name).
      required: false
      selector:
        text:
    species:
      name: Species
      description: >
        Optional user-entered species (scientific or common name). Kept
        over the vision model's guess when provided, and survives an
        identify failure. Blank = the vision model fills it in.
      required: false
      example: "Leucophyllum frutescens"
      selector:
        text:
    emitter_count:
      name: Drip count
      description: Number of drip emitters on this plant (set with GPH).
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    emitter_gph:
      name: Drip size (GPH)
      description: Gallons per hour of each emitter (set with count).
      required: false
      selector:
        number:
          min: 0.1
          max: 50
          step: any
          mode: box

test_vision_endpoint:
  name: Test vision endpoint
  description: >
    Probe the configured vision endpoint (Settings → Vision endpoint) with a tiny
    text request and report reachability and the model's reply. Returns a response
    ({ok, detail}); no fields.
