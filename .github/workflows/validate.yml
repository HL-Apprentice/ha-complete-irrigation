name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Least privilege: this workflow only validates / lints / tests — it never
# writes to the repo or uses secrets, so the default GITHUB_TOKEN is scoped
# down to read-only.
permissions:
  contents: read

jobs:
  hassfest:
    name: HA Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    # Skip on pull_request: hacs/action re-fetches the PR head branch from the
    # GitHub API, which 404s ("branch removed / not compliant") if the PR was
    # merged + branch-deleted while this job sat queued. Push events on the
    # branch, on main, and on tags still validate the structure.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets added in Slice 17 (v1.0 release prep).
          ignore: brands

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check custom_components/ tests/ scripts/
      - name: ruff format check
        run: ruff format --check custom_components/ tests/ scripts/

  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest tests/ -v
