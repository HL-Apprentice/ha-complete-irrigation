name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Least privilege: this workflow only validates / lints / tests — it never
# writes to the repo or uses secrets, so the default GITHUB_TOKEN is scoped
# down to read-only.
permissions:
  contents: read

jobs:
  hassfest:
    name: HA Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    # hacs/action re-fetches the ref from the GitHub API, which 404s
    # ("branch removed / not compliant") if the ref was deleted while the job
    # sat queued — exactly what happens to a feature branch on squash-merge
    # (--delete-branch) and to a PR head. So run HACS ONLY where the ref is
    # durable: pushes to main + tags, plus the daily schedule and manual
    # dispatch. PRs and feature-branch pushes skip it (the structure is still
    # validated on main + every release tag).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    # ADVISORY ONLY (continue-on-error): this repository is PRIVATE. hacs/action
    # validates repos for the PUBLIC HACS store by fetching hacs.json + manifest.json
    # via the GitHub API, which returns None for a private repo's contents — so BOTH
    # the `hacsjson` and `integration_manifest` checks fail no matter what those files
    # contain (verified: even a minimal `{"name": "..."}` hacs.json fails). The store
    # check is inapplicable here — the integration is installed as a custom repo, and
    # the manifest is authoritatively validated by hassfest above + the unit tests.
    # Kept (not deleted) so it just works if the repo is ever made public.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets added in Slice 17 (v1.0 release prep).
          ignore: brands

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check custom_components/ tests/ scripts/
      - name: ruff format check
        run: ruff format --check custom_components/ tests/ scripts/

  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest tests/ -v

  # Without Home Assistant installed, every test that imports the integration's
  # HA-facing modules is skipped at collection — 315 of them. CI was therefore
  # green while a THIRD of the suite never ran. This job installs HA so the full
  # suite executes; the job above stays as the no-HA import guard.
  pytest-full:
    name: Unit tests (with Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HA + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install homeassistant
      - name: Run the FULL suite
        run: python -m pytest tests/ -q

  # The panel is ~11k lines — half the shipped surface — and had no automated
  # verification of any kind before v1.62. A render-time TypeError there takes
  # the entire panel down, which is what shipped in v1.60.4.
  frontend:
    name: Panel (JS syntax + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check the panel
        run: node --check custom_components/complete_irrigation/frontend/complete-irrigation-panel.js
      - name: Panel unit tests
        run: node --test "tests/js/*.test.js"
