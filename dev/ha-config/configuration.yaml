# Disposable HA config used only by `dev/docker-compose.yml` for
# local smoke-testing this integration. NOT a production config.

default_config:

logger:
  default: info
  logs:
    custom_components.complete_irrigation: debug

# Template switches so the integration's zone picker has something
# to choose during smoke testing. Backed by input_booleans.
input_boolean:
  test_lawn:
    name: Test Lawn
  test_garden:
    name: Test Garden

# Template weather entity so the irrigation panel's "Condition" cell
# has something to display during smoke testing.
template:
  - weather:
      - name: "Test Weather"
        condition_template: "partlycloudy"
        temperature_template: "72"
        temperature_unit: "°F"
        humidity_template: "55"

# Simple template sensors for exercising the Sensors + Zones tabs.
sensor:
  - platform: template
    sensors:
      test_lawn_moisture:
        friendly_name: "Test Lawn Moisture"
        value_template: "27"
        unit_of_measurement: "%"
      test_lawn_temperature:
        friendly_name: "Test Lawn Temperature"
        value_template: "74"
        unit_of_measurement: "°F"
      test_lawn_humidity:
        friendly_name: "Test Lawn Humidity"
        value_template: "52"
        unit_of_measurement: "%"

switch:
  - platform: template
    switches:
      test_lawn:
        friendly_name: "Test Lawn"
        value_template: "{{ is_state('input_boolean.test_lawn', 'on') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.test_lawn
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.test_lawn
      test_garden:
        friendly_name: "Test Garden"
        value_template: "{{ is_state('input_boolean.test_garden', 'on') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.test_garden
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.test_garden
