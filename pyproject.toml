[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complete_irrigation"
version = "1.50.0"
description = "Home Assistant custom integration for complete irrigation control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "HL-Apprentice", email = "HL-Apprentice@users.noreply.github.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:homeassistant.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party code (PyETO, BSD-3-Clause) — not ours to restyle; keep it
# byte-for-byte upstream + carry its license (pyeto/LICENSE.txt).
extend-exclude = ["custom_components/complete_irrigation/pyeto"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # function calls in arg defaults — common in HA
]

[tool.ruff.lint.per-file-ignores]
# Dev/script files contain markdown bodies as Python strings — long
# lines, en-dashes, and the multiplication sign (e.g. "256×256") are
# intentional typography in docstrings and comments.
"scripts/*" = ["E501", "RUF001", "RUF002"]
